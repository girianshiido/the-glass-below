<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Glass Below · Local visual checks</title>
<style>body{max-width:700px;margin:5vh auto;padding:24px;color:#ead8b0;background:#10232d;font:17px/1.6 system-ui}button{font:inherit;padding:12px 20px;margin:6px;background:#dcc18b;border:0;border-radius:6px}small{display:block;color:#a9c2c4}</style>
<h1>Local visual checks</h1><p>Load a reproducible scene to check rendering, touch controls and physical passages. These development fixtures replace only this origin’s local test checkpoint. Sound is muted automatically.</p><button data-scene="village">Village square</button><button data-scene="gate">Village gate</button><button data-scene="inn">Inn door</button><button data-scene="shop">Shop door</button><button data-scene="battle">Road battle</button><button data-scene="road">Forest path</button><button data-scene="glassworks">Glassworks stairs</button><button data-scene="crypts">Crypt great hall</button><small>Run with pnpm dev. This page is not included in the production build.</small>
<script type="module">
import {createGame} from '../src/engine.ts';import {setupCampaign,refreshStats} from '../src/campaign.ts';import {serialize} from '../src/save.ts';import {revealRegion} from '../src/region-world.ts';
for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{const scene=button.dataset.scene,zone=['gate','inn','shop'].includes(scene)?'village':scene==='battle'?'road':scene,g=setupCampaign(createGame());Object.assign(g.campaign,{zone,stage:zone==='village'?1:5,recruited:zone!=='village',level:3,introRead:true,roadCleared:zone==='village'?[]:['road-shards','road-hollow','road-lantern']});refreshStats(g);g.heroes.forEach(h=>{h.hp=h.maxHp;h.mp=h.maxMp});if(scene==='gate'){g.position={x:19,y:8};g.direction=0;}if(scene==='inn'){g.position={x:4,y:9};g.direction=3;}if(scene==='shop'){g.position={x:16,y:12};g.direction=3;}if(zone==='road'){g.position={x:1,y:10};g.direction=0;}if(scene==='battle'){g.position={x:4,y:10};g.direction=0;}if(zone==='glassworks'){g.position={x:19,y:2};g.direction=3;g.cleared=new Set([...g.campaign.roadCleared,'furnace']);}if(zone==='crypts'){g.position={x:12,y:11};g.direction=0;g.key=g.chestOpen=g.gateOpen=true;g.cleared=new Set([...g.campaign.roadCleared,'furnace','first','watch','pair','passage','vault']);}g.playTime=120;revealRegion(g);localStorage.setItem('hollow-depths:save:v1',serialize(g));localStorage.setItem('the-glass-below:sound:v1',JSON.stringify({muted:true,music:.3,effects:.65}));location.href='../';});
</script></html>
